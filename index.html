<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#111318">
  <title>Web AR 프로토타입</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <!-- 3D 미리보기 (AR 중에는 이 캔버스가 카메라 화면 위에 그려짐) -->
  <div id="viewer"></div>

  <!-- 미리보기 화면 UI -->
  <section id="home">
    <header class="home-head">
      <h1>Web AR 프로토타입</h1>
      <p id="device-note">모델을 고르고 <b>AR로 보기</b>를 누르면 책상 위에 모델을 놓을 수 있어요.</p>
    </header>

    <div class="home-bottom">
      <div class="anim-row">
        <button id="play-btn" class="btn" disabled>▶ 애니메이션 재생</button>
        <select id="clip-select" class="select hidden" aria-label="애니메이션 선택"></select>
      </div>
      <div id="model-chips" class="chips" role="listbox" aria-label="모델 선택"></div>
      <button id="ar-btn" class="btn primary big">AR로 보기</button>
    </div>
  </section>

  <!-- 안드로이드 WebXR AR 중에 카메라 화면 위에 보이는 UI (dom-overlay) -->
  <div id="xr-overlay" class="hidden">
    <div class="ar-top">
      <button id="exit-btn" class="btn round" aria-label="AR 끝내기">✕</button>
      <div id="status" class="status">책상을 천천히 비춰 주세요</div>
      <button id="replace-btn" class="btn hidden">📍 다시 놓기</button>
    </div>
    <div class="ar-bottom">
      <div class="anim-row">
        <button id="xr-play-btn" class="btn" disabled>▶ 애니메이션 재생</button>
        <select id="xr-clip-select" class="select hidden" aria-label="애니메이션 선택"></select>
      </div>
      <div id="xr-model-chips" class="chips"></div>
    </div>
  </div>

  <!-- 아이폰 AR 뷰어(Quick Look)로 넘기기 위한 숨은 링크 (img 가 꼭 있어야 동작) -->
  <a id="quicklook" rel="ar" href="#" class="hidden"><img alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACw="></a>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
